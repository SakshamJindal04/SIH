<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Reader - SafeKart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
    <div class="nav-logo"><a href="index.html">SafeKart</a></div>
    <ul class="nav-links">
        <li><a href="shopping.html">Shop</a></li>
        <li><a href="verify.html">Verify</a></li>
        <li><a href="qr_reader.html">Scan</a></li>
        <li><a href="qr_generator.html">Generate QR</a></li>
        <li><a href="track.html">Track</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="admin.html">Admin</a></li>
    </ul>
    <label class="theme-switch" for="theme-toggle">
        <input type="checkbox" id="theme-toggle" />
        <span class="slider"></span>
    </label>
</nav>
    <div class="main-content">
        <div class="container">
            <header>
                <h1>📷 QR Code Reader</h1>
                <p>Point your camera at a QR code to scan it.</p>
            </header>
            <div id="reader-container" style="position: relative;">
                <div id="reader-skeleton" class="skeleton-loader" style="border-radius: var(--border-radius); display: flex; align-items: center; justify-content: center; font-weight: 500; color: var(--text-muted);">
                    Initializing Camera...
                </div>
                <div id="reader" style="display: none;"></div>
            </div>
            <div id="result" class="verification-result"></div>
        </div>
    </div>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script>
        const resultContainer = document.getElementById('result');
        function onScanSuccess(decodedText, decodedResult) {
            resultContainer.innerHTML = `<div class="result-icon">✅</div><h3 style="margin-top:0">Scan Successful</h3><a href="${decodedText}" style="color: var(--primary-color); word-break: break-all;">${decodedText}</a>`;
            resultContainer.style.display = 'block';
            resultContainer.classList.add('pass');
            html5QrcodeScanner.clear(); // To stop scanning after success
        }
        
        // Use a slight delay to mimic loading state, giving camera time to initialize
        setTimeout(() => {
            document.getElementById('reader-skeleton').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render(onScanSuccess);
        }, 800);
    </script>
    <footer>
    <div class="footer-quote" id="footer-quote">Trust is built with consistency.</div>
    <div class="footer-links">
        <a href="about.html">About SafeKart</a>
    </div>
    <p class="footer-copyright">&copy; 2026 SafeKart. All Rights Reserved.</p>
</footer>
    <script src="theme.js"></script>
</body>
</html>
